name: Contract

on:
  push:
    branches: [main]
    paths:
      - "packages/contract/**"
      - "contracts/**"
      - "compose.yaml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "packages/contract/**"
      - "contracts/**"
      - "compose.yaml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -w @jobflow/contract
      - run: npm run build -w @jobflow/contract
      - run: docker compose --profile mock up -d mock
      - run: npm run mock:smoke -w @jobflow/contract
