name: Review skill

on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - "career-ops-wrapper/package-lock.json"
      - ".github/workflows/review-skill.yml"
  pull_request:
    paths:
      - ".claude/skills/**"
      - "career-ops-wrapper/package-lock.json"
      - ".github/workflows/review-skill.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: career-ops-wrapper/package-lock.json
      # impact-map.mjs loads the TypeScript compiler the wrapper pins.
      - run: npm ci
        working-directory: career-ops-wrapper
      - run: node --test '.claude/skills/review-change/scripts/*.test.mjs'
