name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "career-ops-wrapper/contracts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "career-ops-wrapper/contracts/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Debug builds sign with the shared key that the repository keeps base64-encoded.
      - name: Decode debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore
      - name: Verify
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug testDevDebugUnitTest lintDevDebug detekt ktlintCheck
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build unsigned prod release APK (R8)
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease

  agent-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test hooks and agent instruction files
        run: python3 -m unittest discover -s tools/agents -t tools/agents
