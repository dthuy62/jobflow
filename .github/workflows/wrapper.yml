name: Wrapper

on:
  push:
    branches: [main]
    paths:
      - "career-ops-wrapper/**"
      - "packages/safety/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/wrapper.yml"
  pull_request:
    paths:
      - "career-ops-wrapper/**"
      - "packages/safety/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/wrapper.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -w @jobflow/safety
      - run: npm test -w career-ops-wrapper
      - run: npm run build -w career-ops-wrapper
